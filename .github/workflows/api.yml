name: API Java checks
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'scripts/harness/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/wrapper-validation@v4
      - run: node scripts/harness/run-api.mjs check
