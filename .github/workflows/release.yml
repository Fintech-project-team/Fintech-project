name: Verified server release
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/ai/**'
      - '.github/workflows/release.yml'
  push:
    paths:
      - 'apps/api/**'
      - 'apps/ai/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/deploy/requirements.txt
      - run: python -B -m unittest discover -s apps/api/tests -p test_release_server.py
      - run: python -B -m unittest discover -s apps/api/tests -p test_portable_server.py
      - run: python -B -m unittest discover -s apps/api/tests -p test_server_runtime.py
      - name: Existing Windows installation transaction checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/api/tests/Test-Release.ps1

  package:
    needs: portable-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      GRADLE_OPTS: -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/wrapper-validation@v4
      - run: python -m pip install -r apps/api/deploy/requirements.txt
      - name: Existing API and AI checks
        run: node scripts/harness/run-api.mjs check
      - name: PostgreSQL 15 tooling from the PostgreSQL repository
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-15
      - name: Isolated database and HTTP regression
        run: >-
          python -B apps/api/database/test_analysis_service.py
          --pg-bin /usr/lib/postgresql/15/bin
          --work-dir "${{ runner.temp }}/payse-release-db"
      - name: Package the checked commit
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/sunghyun-dev')
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_RUN: ${{ github.run_id }}
        run: |
          jars=(apps/api/build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          python -B apps/api/tools/release_server.py build \
            --jar "${jars[0]}" --output dist/verified-server \
            --commit "$RELEASE_SHA" --repository "$RELEASE_REPOSITORY" \
            --branch "$RELEASE_BRANCH" --run-id "$RELEASE_RUN"
      - name: Publish the immutable server artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/sunghyun-dev')
        uses: actions/upload-artifact@v4
        with:
          name: payse-api-${{ github.sha }}
          path: dist/verified-server/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

# Deployment is an explicit local action after downloading and verifying a successful run.
