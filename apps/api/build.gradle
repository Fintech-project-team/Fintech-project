plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.payse'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation project(':ai')
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking { lockAllConfigurations() }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
def docToolOutput = layout.buildDirectory.dir('doc-tools')
tasks.register('compileDocTools', JavaCompile) {
    source files('tools/VerifyApiDocs.java')
    source fileTree('src/main/java/com/payse/api/constants') { include '*.java' }
    classpath = files()
    destinationDirectory = docToolOutput
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.named('test') {
    exclude '**/GammaLiveTest*'
    dependsOn 'compileDocTools'
    systemProperty 'payse.docToolClasspath', docToolOutput.get().asFile.absolutePath
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped' }
}

// Explicit, removable synthetic-gamma runner. Normal tests and CI never make paid calls.
tasks.register('gammaLiveTest', Test) {
    dependsOn 'testClasses'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/GammaLiveTest.class'
    useJUnitPlatform()
    maxHeapSize = '512m'
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    doFirst {
        if (System.getenv('PAYSE_GAMMA_LIVE') != 'approved') {
            throw new GradleException('Use the explicit gamma_local.py live runner')
        }
    }
    testLogging { events 'failed'; showStandardStreams = false }
}

tasks.register('gammaLocalServer', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.payse.api.analysis.service.GammaLocalServer'
    maxHeapSize = '512m'
}
tasks.register('apiDocsCheck', Exec) {
    dependsOn 'compileDocTools'
    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    def javaExecutable = launcher.get().executablePath.asFile.absolutePath
    commandLine javaExecutable, '-cp', docToolOutput.get().asFile.absolutePath,
        'VerifyApiDocs', 'src/main/java', 'src/test/java', 'tools',
        '../ai/src/main/java', '../ai/src/test/java'
}
tasks.named('check') { dependsOn 'apiDocsCheck', ':ai:check' }
// Offline analysis contracts and private evaluation labels; no provider or DB access.
tasks.register('analysisContracts', Exec) {
    commandLine 'python', '-B', '-m', 'unittest', 'discover',
        '-s', 'testing/analysis', '-p', 'test_*.py'
}
tasks.named('test') { dependsOn 'analysisContracts', ':ai:test' }
tasks.named('jar') { enabled = false }

// Verify the deployable artifact contains AI runtime code but no private evaluation material.
tasks.register('aiArchiveCheck') {
    dependsOn 'bootJar'
    doLast {
        def archive = tasks.named('bootJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { boot ->
            if (boot.entries().toList().any { it.name.contains('/GammaLocal') || it.name.contains('/GammaLive') }) {
                throw new GradleException('Gamma-only test code entered the deployment JAR')
            }
            def aiEntries = boot.entries().toList().findAll { it.name.startsWith('BOOT-INF/lib/ai-') && it.name.endsWith('.jar') }
            if (aiEntries.size() != 1) throw new GradleException('Expected one shared AI module in Boot JAR')
            def names = []
            def aiStream = boot.getInputStream(aiEntries.first())
            new java.util.zip.ZipInputStream(aiStream).withCloseable { nested ->
                for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) names.add(entry.name)
            }
            if (!names.contains('com/payse/ai/analysis/service/AnalysisService.class')) {
                throw new GradleException('AI runtime missing from deployment')
            }
            def containsPrivateMaterial = names.any {
                it.contains('expected.private') || it.contains('meaning-policy.json') ||
                    it.contains('/testing/') || it.contains('/cases/') || it.endsWith('Test.class')
            }
            if (containsPrivateMaterial) {
                throw new GradleException('Private evaluation material entered AI deployment')
            }
            def publicFiles = names.findAll { it.startsWith('com/payse/ai/rules/') && !it.endsWith('/') }
            def expectedPublic = ['criteria.json', 'instructions.txt', 'prompt-guide.json',
                'transactionMeaning.input.schema.json', 'transactionMeaning.output.schema.json',
                'recurringMeaning.input.schema.json', 'recurringMeaning.output.schema.json']
                .collect { 'com/payse/ai/rules/' + it }.toSet()
            if (publicFiles.toSet() != expectedPublic) throw new GradleException('Unexpected AI public resource set')
        }
    }
}
tasks.named('check') { dependsOn 'aiArchiveCheck' }
