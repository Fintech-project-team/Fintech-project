name: payse
description: PAYSE common Flutter application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.5 <3.14.0'
  flutter: '3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  package_info_plus: 10.2.2
  payse_calculation:
    path: ../../packages/payse_calculation
  shared_preferences: 2.5.6

# flutter_secure_storage가 끌어오는 path_provider_foundation 2.6.0은 objective_c 네이티브 빌드가 필요한데, 로컬 macOS의
# SDK 27·Command Line Tools 26.6 링커 불일치로 flutter test가 실패한다. 2.5.1은 objective_c가 없고 Android에는 쓰이지 않는
# iOS·macOS 구현이다. 개발 도구를 맞추거나 objective_c 빌드 문제가 해결되면 이 고정을 지운다.
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/MaterialSymbols-LICENSE.txt
    - assets/fixtures/demo-ready.json
    - assets/fixtures/demo-life.json
    - assets/fixtures/alpha-ready.json
    - assets/fixtures/alpha-shock.json
    - assets/fixtures/salary-wait.json
    - assets/fixtures/alpha-unconnected.json
    - assets/fixtures/beta-ready.json
    - assets/fixtures/beta-life.json
    - assets/fixtures/gamma-month-end.json
    - assets/fixtures/gamma-life.json
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: PayseSymbols
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded-subset.ttf
